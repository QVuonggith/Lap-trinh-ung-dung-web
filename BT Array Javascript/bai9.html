<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function alternateSum(arr) {
            let sum = 0;

            for (let i = 0; i < arr.length; i++) {
                if (i % 2 == 0) {
                    sum += arr[i];
                } else {
                    sum -= arr[i];
                }
            }

            return sum;
        }

        document.write(alternateSum([10, 5, 6, 3]) + "<br>");
        document.write(alternateSum([1, 2, 3, 4, 5]));
    </script>
</body>
</html>
