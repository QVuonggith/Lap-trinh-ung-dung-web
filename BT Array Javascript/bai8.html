<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function countGreaterThan(arr, value) {
            let count = 0;

            for (let i = 0; i < arr.length; i++) {
                if (arr[i] > value) {
                    count++;
                }
            }

            return count;
        }

        document.write(countGreaterThan([1, 5, 7, 2, 3], 3) + "<br>");
        document.write(countGreaterThan([2, 3, 1, -6, 8], 5) + "<br>");
        document.write(countGreaterThan([], 5));
    </script>
</body>
</html>
