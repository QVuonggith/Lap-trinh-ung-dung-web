<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function sumOfSquares(arr) {
            let sum = 0;

            for (let i = 0; i < arr.length; i++) {
                sum += arr[i] * arr[i];
            }

            return sum;
        }

        document.write(sumOfSquares([1, 2, 3]) + "<br>");
        document.write(sumOfSquares([4, 5, 6]));
    </script>
</body>
</html>
