<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function findLongestWord(arr) {
            let longest = arr[0];

            for (let i = 1; i < arr.length; i++) {
                if (arr[i].length > longest.length) {
                    longest = arr[i];
                }
            }

            return longest;
        }

        document.write(findLongestWord(["apple", "banana", "cherry", "date"]) + "<br>");
        document.write(findLongestWord(["hello", "world", "this", "is", "great"]));
    </script>
</body>
</html>
