<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function filterEvensAndSum(arr) {
            let sum = 0;

            for (let i = 0; i < arr.length; i++) {
                if (arr[i] % 2 == 0) {
                    sum += arr[i];
                }
            }

            return sum;
        }

        document.write(filterEvensAndSum([1, 2, 3, 4, 5, 6]) + "<br>");
        document.write(filterEvensAndSum([12, 14, 15, 19, 20, 100]));
    </script>
</body>
</html>
