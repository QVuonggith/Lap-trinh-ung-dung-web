<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Xep Loai Hoc Luc</h2>
    <label for="">Nhap diem</label>
    <input type="number" id="diem">
    <button onclick="xepDiem()">hien thi hoc luc</button>
    <p id="ketqua"></p>
    <script>
        function xepDiem(){
            let diem = document.getElementById("diem").value;
            if (diem >= 90) {
                document.getElementById("ketqua").innerHTML = "Xep loai: A";
            } else if (diem >= 80) {
                document.getElementById("ketqua").innerHTML = "Xep loai: B";
            } else if (diem >= 70) {
                document.getElementById("ketqua").innerHTML = "Xep loai: C";
            } else if (diem >= 60) {
                document.getElementById("ketqua").innerHTML = "Xep loai: D";
            } else {
                document.getElementById("ketqua").innerHTML = "Xep loai: F";
            }
        }
    </script>
</body>
</html>
