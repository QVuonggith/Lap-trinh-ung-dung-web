<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>DOAN SO MAY MAN</h2>
    <label for="">Nhap so tu 1 den 10</label>
    <input type="number" id="so">
    <button onclick="doanSo()">Kiem tra</button>
    <p id="ketqua"></p>
    <script>
        function doanSo(){
            let soDoan = document.getElementById("so").value;
            let soMayMan = Math.floor(Math.random() * 10) + 1;
            if (soDoan == soMayMan) {
                document.getElementById("ketqua").innerHTML = "Chuc mung! Ban da thang (So may man: " + soMayMan + ")";
            } else {
                document.getElementById("ketqua").innerHTML = "Chua may man : " + soMayMan;
            }
        }
    </script>
</body>
</html>
